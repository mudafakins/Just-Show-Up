# Builds the Windows installer on GitHub's free Windows machines.
# Download it from the run's page: Actions -> Windows build -> the run -> Artifacts.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL  https://<project>.supabase.co
#   SUPABASE_KEY  the publishable (anon) key — the same values as Config.local.json
name: Windows build

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target

      - run: npm ci

      - name: Write Supabase settings
        shell: pwsh
        run: |
          if (-not "${{ secrets.SUPABASE_URL }}") { throw "Add the SUPABASE_URL and SUPABASE_KEY repository secrets first." }
          @(
            "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            "VITE_SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}"
          ) | Out-File -FilePath .env.local -Encoding utf8

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: JustShowUp-Windows-installer
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
